<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Recipe Box</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <h1>My Recipe Box</h1>
    <p class="tagline">A collection of recipes I've found tasty</p>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab-btn active" data-filter="all">All</button>
    <button class="tab-btn" data-filter="breakfast">Breakfast</button>
    <button class="tab-btn" data-filter="lunch">Lunch</button>
    <button class="tab-btn" data-filter="dinner">Dinner</button>
    <button class="tab-btn" data-filter="dessert">Desserts</button>
    <button class="tab-btn" data-filter="spring">Spring</button>
    <button class="tab-btn" data-filter="summer">Summer</button>
    <button class="tab-btn" data-filter="fall">Fall</button>
    <button class="tab-btn" data-filter="winter">Winter</button>
  </nav>

  <main>
    <div class="recipe-grid" id="recipeGrid">
      <!-- Recipe cards are injected here by script.js -->
    </div>
    <p class="empty-message" id="emptyMessage" hidden>No recipes found for this category yet.</p>
  </main>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" id="modalClose" aria-label="Close">&times;</button>
      <h2 id="modalTitle"></h2>
      <div class="modal-tags" id="modalTags"></div>
      <div class="modal-body">
        <div>
          <h3>Ingredients</h3>
          <ul id="modalIngredients"></ul>
        </div>
        <div>
          <h3>Instructions</h3>
          <ol id="modalInstructions"></ol>
        </div>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="theme-picker">
      <label for="themeSelect">Theme:</label>
      <select id="themeSelect">
        <option value="auto">Auto (current season)</option>
        <option value="spring">Spring</option>
        <option value="summer">Summer</option>
        <option value="fall">Fall</option>
        <option value="winter">Winter</option>
        <option value="halloween">Halloween</option>
        <option value="christmas">Christmas</option>
      </select>
    </div>
    <p></p>
  </footer>

  <script src="js/recipes-data.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
